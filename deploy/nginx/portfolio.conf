# Install in Nginx's http context after issuing certificates for both names.
map $request_method $portfolio_login_key {
  default "";
  POST $binary_remote_addr;
}
limit_req_zone $portfolio_login_key zone=portfolio_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=portfolio_editor:1m rate=30r/m;
limit_req_status 429;

server {
  listen 80;
  server_name portfolio.example.invalid admin.example.invalid;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 308 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_name portfolio.example.invalid;
  ssl_certificate /etc/letsencrypt/live/portfolio.example.invalid/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/portfolio.example.invalid/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  include /etc/nginx/portfolio-proxy.inc;
  location / { proxy_pass http://127.0.0.1:3000; }
}

server {
  listen 443 ssl;
  server_name admin.example.invalid;
  ssl_certificate /etc/letsencrypt/live/admin.example.invalid/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.example.invalid/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  client_max_body_size 400k;
  include /etc/nginx/portfolio-proxy.inc;

  location = /api/session {
    limit_req zone=portfolio_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:3001;
  }
  location ~ ^/api/(content|profile)(/|$) {
    limit_req zone=portfolio_editor burst=15 nodelay;
    proxy_pass http://127.0.0.1:3001;
  }
  location / { proxy_pass http://127.0.0.1:3001; }
}
